<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Study Tracker</title>
    <base href="/" />
    <script>
        // Applies the saved theme before the first paint; the Theme service keeps it in sync afterwards.
        try {
            var theme = localStorage.getItem("theme");
            if (theme === "light" || theme === "dark") document.documentElement.dataset.theme = theme;
        } catch (e) { }
    </script>
    <link rel="stylesheet" href="_content/StudyTracker.UI/app.css" />
    <link rel="stylesheet" href="StudyTracker.styles.css" />
</head>
<body>
    <div id="app"><p class="loading">Carregando…</p></div>
    <script src="_framework/blazor.webview.js"></script>
</body>
</html>
