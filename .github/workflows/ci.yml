name: CI

# Pull requests only: every push to main already runs the tests in the release workflow.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    # The desktop app targets net10.0-windows, so everything builds on Windows.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test
        run: dotnet test --configuration Release --no-build --verbosity normal
