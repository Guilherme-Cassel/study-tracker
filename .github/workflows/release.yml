name: Release

# Every push to main that passes the tests becomes a release: version 1.0.<run number>, tag v1.0.<run number>,
# and a framework-dependent build (needs the .NET 10 Desktop Runtime) attached to it.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    env:
      VERSION: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Test
        run: dotnet test --configuration Release

      - name: Publish
        shell: pwsh
        run: >
          dotnet publish src/StudyTracker.Desktop
          --configuration Release
          --runtime win-x64
          --self-contained false
          "-p:Version=$env:VERSION"
          --output publish

      - name: Package
        shell: pwsh
        run: |
          $zip = "StudyTracker-$env:VERSION-win-x64.zip"
          Copy-Item src/StudyTracker.Desktop/appsettings.Local.example.json publish/
          Compress-Archive -Path publish/* -DestinationPath $zip
          "ZIP=$zip" >> $env:GITHUB_ENV

      - name: Create release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "v$env:VERSION" $env:ZIP
          --target '${{ github.sha }}'
          --title "Study Tracker $env:VERSION"
          --generate-notes
